<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foco — Temporizador</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<main>
<div class="brand"><span>◌</span> Foco</div>
<div class="clock"><span class="dot" aria-hidden="true"></span> HORÁRIO DE BRASÍLIA <time id="clock">00:00:00</time></div>
<h1>Um momento para se concentrar.</h1>
<div class="timer" aria-label="Duração do temporizador">
<div class="unit"><input id="hours" type="number" min="0" max="99" value="00" aria-label="Horas"><label for="hours">Horas</label></div>
<span class="colon" aria-hidden="true">:</span>
<div class="unit"><input id="minutes" type="number" min="0" max="59" value="25" aria-label="Minutos"><label for="minutes">Minutos</label></div>
<span class="colon" aria-hidden="true">:</span>
<div class="unit"><input id="seconds" type="number" min="0" max="59" value="00" aria-label="Segundos"><label for="seconds">Segundos</label></div>
</div>
<div class="progress" aria-hidden="true"><div id="bar"></div></div>
<div class="presets" aria-label="Predefinições de tempo">
<button class="preset" data-time="300">5 min</button><button class="preset" data-time="600">10 min</button><button class="preset" data-time="900">15 min</button><button class="preset active" data-time="1500" aria-pressed="true">25 min</button><button class="preset" data-time="1800">30 min</button><button class="preset" data-time="3600">1 hora</button>
</div>
<div class="actions"><button id="start">▷ Iniciar</button><button id="reset" aria-label="Reiniciar temporizador">↺ Reiniciar</button></div>
<p class="status" id="status" role="status" aria-live="polite">Defina seu tempo. Encontre seu foco.</p>
<label class="settings"><input id="sound" type="checkbox" checked> Aviso sonoro ao finalizar</label>
<footer>Menos distrações. Mais presença.</footer>
</main>
<script src="script.js"></script>
</body>
</html>
